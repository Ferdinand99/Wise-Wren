# Format, lints and tests for every pull request and every push to main, plus
# Docker builds of both images (server and agent) for both architectures on
# pull requests (nothing is pushed). The toolchain matches rust-toolchain.toml
# and the Dockerfile's RUST_VERSION.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.120
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      # Unit tests of both crates, the in-process app tests (tests/wren.rs),
      # the real agent against Wren (tests/agent.rs) and the translation
      # coverage of all 26 languages (tests/i18n.rs).
      - name: Tests
        run: cargo test --workspace --locked

  docker:
    # Builds both images for linux/amd64 and linux/arm64 on native runners (no
    # QEMU) to catch Dockerfile breakage before merging. Cache only;
    # publishing is docker-publish.yml's job.
    name: Docker ${{ matrix.target }} ${{ matrix.platform }}
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        target: [server, agent]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Platform slug
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | sed 's#/#-#g' >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: |
            REVISION=${{ github.sha }}
          # Same cache scopes as docker-publish.yml, so pull requests reuse
          # main's layers.
          cache-from: type=gha,scope=${{ matrix.target }}-${{ env.PLATFORM_PAIR }}
          outputs: type=cacheonly
