[package]
name = "wren-agent"
# Released together with the server (release-please-config.json).
version = "0.10.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Wise Wren's agent: runs on each Docker host and connects out to Wren."
publish = false

[[bin]]
name = "wren-agent"
path = "src/main.rs"

[features]
# Test builds for the Docker self-update scenarios (scaled deadlines, test
# registry and version); never part of a release.
selfupdate-test = []

# Small on purpose: no vole-kit, no web framework, no Docker client crate.
[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "time", "signal", "io-util", "process", "fs"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Only the Docker self-update tests use these: they serve a real Wren (the
# server crate, in this process) to the agent. Nothing here is in the agent
# binary.
[dev-dependencies]
axum = "0.8.9"
vole-kit = { git = "https://github.com/Ferdinand99/Vigilant-Vole", tag = "vole-kit-v0.8.2" }
wise-wren = { path = ".." }
